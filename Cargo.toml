[package]
name = "wagner"
version = "0.1.3"
edition = "2024"
rust-version = "1.85"
description = "AI agent monitoring CLI tool with TUI"
authors = ["Aleks Shteinman <deevsgt15@gmail.com>"]
license = "MIT"
repository = "https://github.com/DeevsDeevs/wagner"
homepage = "https://github.com/DeevsDeevs/wagner"
readme = "README.md"
keywords = ["cli", "ai", "monitoring", "tui", "agent"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
ansi-to-tui = "8.0.0"
anyhow = "1.0.100"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.54", features = ["derive"] }
clap_complete = "4.5"
crossterm = "0.29.0"
directories = "6.0.0"
ratatui = "0.30.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
shellexpand = "3.1.1"
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
uuid = { version = "1.19.0", features = ["v4", "serde"] }
sha2 = "0.10"
